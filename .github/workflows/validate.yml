name: Validate

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint
        run: ruff check custom_components/tgc1

      - name: Compile integration and tests
        run: python -m compileall -q custom_components/tgc1 tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
